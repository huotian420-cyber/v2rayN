name: build Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master
      - feature/subscription-custom-headers

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup .NET
      uses: actions/setup-dotnet@v5.2.0
      with:
        dotnet-version: '8.0.x'

    - name: Install Inno Setup
      run: choco install innosetup --no-progress -y

    - name: Build installer
      working-directory: ./v2rayN
      shell: pwsh
      run: ./scripts/build-installer.ps1

    - name: Upload installer artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: v2rayN-installer-win-x64
        path: artifacts/v2rayN/installer/v2rayN-setup-win-x64-*.exe
        if-no-files-found: error

    - name: Upload installer to release
      if: inputs.release_tag != '' || github.ref_name == 'feature/subscription-custom-headers'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: artifacts/v2rayN/installer/v2rayN-setup-win-x64-*.exe
        tag: ${{ inputs.release_tag || 'system-proxy-fix-test-2026-05-03' }}
        file_glob: true
        overwrite: true
        prerelease: true
        release_name: v2rayN system proxy fix test build
        body: Test installer build for the Xray system proxy fix.
